# Source: chatviz/charts/agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatviz-agent
  labels:
    helm.sh/chart: agent-0.1.0
    app.kubernetes.io/name: agent
    app.kubernetes.io/instance: chatviz
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
      app.kubernetes.io/instance: chatviz
  template:
    metadata:
      labels:
        helm.sh/chart: agent-0.1.0
        app.kubernetes.io/name: agent
        app.kubernetes.io/instance: chatviz
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 120
      securityContext:
        {}
      containers:
        - name: agent
          securityContext:
            {}
          image: "ghcr.io/sfnsys710/chatviz-agent:0.3.1"
          imagePullPolicy: IfNotPresent
          env:
            - name: PHOENIX_ENDPOINT
              value: "http://phoenix-svc:4317"
            - name: PHOENIX_TRACING
              value: "true"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
---
# Source: chatviz/charts/front/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatviz-front
  labels:
    helm.sh/chart: front-0.1.0
    app.kubernetes.io/name: front
    app.kubernetes.io/instance: chatviz
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: front
      app.kubernetes.io/instance: chatviz
  template:
    metadata:
      labels:
        helm.sh/chart: front-0.1.0
        app.kubernetes.io/name: front
        app.kubernetes.io/instance: chatviz
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: default
      securityContext:
        {}
      containers:
        - name: front
          securityContext:
            {}
          image: "ghcr.io/sfnsys710/chatviz-front:0.1.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: "http://chatviz-agent:8000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
---
# Source: chatviz/charts/agent/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chatviz-agent
  labels:
    helm.sh/chart: agent-0.1.0
    app.kubernetes.io/name: agent
    app.kubernetes.io/instance: chatviz
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatviz-agent
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# Source: chatviz/charts/front/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatviz-front
  labels:
    helm.sh/chart: front-0.1.0
    app.kubernetes.io/name: front
    app.kubernetes.io/instance: chatviz
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: nginx
  rules:
    - host: "chatviz.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatviz-front
                port:
                  number: 3000
