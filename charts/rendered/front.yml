---
# Source: front/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: front
  labels:
    helm.sh/chart: front-0.1.0
    app.kubernetes.io/name: front
    app.kubernetes.io/instance: front
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: front
    app.kubernetes.io/instance: front
---
# Source: front/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  labels:
    helm.sh/chart: front-0.1.0
    app.kubernetes.io/name: front
    app.kubernetes.io/instance: front
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: front
      app.kubernetes.io/instance: front
  template:
    metadata:
      labels:
        helm.sh/chart: front-0.1.0
        app.kubernetes.io/name: front
        app.kubernetes.io/instance: front
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: default
      securityContext:
        {}
      containers:
        - name: front
          securityContext:
            {}
          image: "ghcr.io/sfnsys710/chatviz-front:0.1.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: "http://chatviz-agent:8000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 64Mi
---
# Source: front/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front
  labels:
    helm.sh/chart: front-0.1.0
    app.kubernetes.io/name: front
    app.kubernetes.io/instance: front
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: nginx
  rules:
    - host: "chatviz.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  number: 3000
---
# Source: front/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "front-test-connection"
  labels:
    helm.sh/chart: front-0.1.0
    app.kubernetes.io/name: front
    app.kubernetes.io/instance: front
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['front:3000']
  restartPolicy: Never
