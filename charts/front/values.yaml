# Default values for front.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/sfnsys710/chatviz-front
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  # (kept in sync with package.json version). Empty on purpose.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false  # port-forward for now; env overlays turn this on when ingress-nginx exists (P4)
  className: "nginx"
  annotations: {}
  hosts:
    - host: chatviz.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

env:
  BACKEND_URL: "http://chatviz-agent:8000"